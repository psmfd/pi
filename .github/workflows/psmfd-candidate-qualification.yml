name: psmfd-candidate-qualification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-build:
    name: qualify offline release workspace build
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'sync/upstream-v1.3.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up release-major Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Hydrate digest-selected release model data
        run: |
          set -euo pipefail
          npm pack @earendil-works/pi-ai@1.3.0 --ignore-scripts --pack-destination "$RUNNER_TEMP"
          printf '5343e1639bf343bdc3344df3ad6c31c05a50b68bad07ac6bce10890d4b6b8a61  %s\n' "$RUNNER_TEMP/earendil-works-pi-ai-1.3.0.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/earendil-works-pi-ai-1.3.0.tgz" -C "$RUNNER_TEMP" package/dist/providers/data
          mkdir -p packages/ai/src/providers/data
          cp "$RUNNER_TEMP"/package/dist/providers/data/*.json "$RUNNER_TEMP"/package/dist/providers/data/.manifest.json packages/ai/src/providers/data/
      - name: Run retained release build and regression controls in an offline namespace
        # Namespace creation requires privileges on the disposable hosted runner.
        # The retained harness clears the build environment and exposes only its fixture.
        run: >-
          sudo env GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory
          GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" "$(command -v node)"
          --test .psmfd/test/release-build.test.mjs
